<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>30 Dages Karakterudfordring</title>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.6;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

h2 {
    margin-top: 40px;
}

.button {
    display: inline-block;
    padding: 14px 24px;
    border: 1px solid #8B0000;
    color: #fff;
    text-decoration: none;
    margin-top: 20px;
}

.button:hover {
    background: #8B0000;
}

.checklist label {
    display: block;
    margin: 8px 0;
}

.challenge-box {
    border-top: 1px solid #333;
    margin-top: 40px;
    padding-top: 20px;
}
</style>

</head>
<body>

<div class="container">

<h1>30 Dages Karakterudfordring</h1>
<p>5 minutter om dagen. Ingen undskyldninger.</p>

<a href="#challenge" class="button">Start dag 1</a>

<h2>Spilleregler</h2>
<p>
• 30 dage<br>
• Én handling dagligt<br>
• Ingen over – ingen genveje
</p>

<h2>Din progression</h2>

<div class="checklist" id="checklist"></div>

<div id="challenge" class="challenge-box">
<h2>Dag <span id="dayNumber"></span></h2>

<p><strong>Handling:</strong><br>
<span id="action"></span></p>

<p><strong>Refleksion:</strong><br>
<span id="reflection"></span></p>

</div>

</div>

<script>
const challenges = [
{day:1, action:"Gør den opgave du har udskudt.", reflection:"Hvorfor gjorde du den ikke før?"},
{day:2, action:"Tag fuldt ansvar for én situation.", reflection:"Hvad sker der uden forklaringer?"},
{day:3, action:"Gør noget du ikke har lyst til.", reflection:"Lyst eller retning?"},
{day:4, action:"Sig én sandhed klart.", reflection:"Hvor pakker du ting ind?"},
{day:5, action:"Fokusér 60 min uden distraktion.", reflection:"Travl eller effektiv?"},
{day:6, action:"Gør noget du undgår.", reflection:"Hvad koster det dig?"},
{day:7, action:"Luk en åben opgave.", reflection:"Hvor meget fylder den?"},
{day:8, action:"Sig hvad du forventer.", reflection:"Er du tydelig?"},
{day:9, action:"Lyt uden at afbryde.", reflection:"Forstår du eller svarer du?"},
{day:10, action:"Prioritér én ting.", reflection:"Hvad er vigtigst?"},
{day:11, action:"Gør noget der giver energi.", reflection:"Kører du på tom?"},
{day:12, action:"Følg op på noget.", reflection:"Kan man regne med dig?"},
{day:13, action:"Tag en beslutning.", reflection:"Hvad koster ventetiden?"},
{day:14, action:"Gør noget ordentligt i det skjulte.", reflection:"Hvem er du?"},
{day:15, action:"Giv ærlig feedback.", reflection:"Hvorfor holder du igen?"},
{day:16, action:"Identificér en dårlig vane.", reflection:"Hvor længe endnu?"},
{day:17, action:"Sænk tempoet.", reflection:"Hvad opdager du?"},
{day:18, action:"Tag ansvar for en fejl.", reflection:"Tillid?"},
{day:19, action:"Stil 3 spørgsmål først.", reflection:"Vil du forstå?"},
{day:20, action:"Sig nej.", reflection:"Hvorfor sagde du ja?"},
{day:21, action:"Hæv kvaliteten.", reflection:"Hvor stopper du normalt?"},
{day:22, action:"Vær til stede.", reflection:"Er du her?"},
{day:23, action:"Start på det du udskyder.", reflection:"Hvad sker der når du starter?"},
{day:24, action:"Planlæg din dag.", reflection:"Hvem styrer?"},
{day:25, action:"Ræk ud uden agenda.", reflection:"Hvorfor gør du det ikke?"},
{day:26, action:"Vær ærlig med dig selv.", reflection:"Hvad ignorerer du?"},
{day:27, action:"Bliv 10 min længere.", reflection:"Hvornår giver du op?"},
{day:28, action:"Hæv standarden.", reflection:"Hvad accepterer du?"},
{day:29, action:"Se fra andres perspektiv.", reflection:"Hvad overser du?"},
{day:30, action:"Gør det dit bedste jeg ville gøre.", reflection:"Fortsætter du?"}
];

// Progress tracker
const checklist = document.getElementById("checklist");

challenges.forEach(c => {
    const checked = localStorage.getItem("day"+c.day) === "true";

    checklist.innerHTML += `
        <label>
            <input type="checkbox" onchange="save(${c.day})" ${checked ? "checked" : ""}>
            Dag ${c.day}
        </label>
    `;
});

function save(day){
    const cb = document.querySelectorAll("input")[day-1];
    localStorage.setItem("day"+day, cb.checked);
}

// Show current day
const today = new Date().getDate() % 30 || 1;
const current = challenges[today-1];

document.getElementById("dayNumber").innerText = current.day;
document.getElementById("action").innerText = current.action;
document.getElementById("reflection").innerText = current.reflection;

</script>

</body>
</html>
