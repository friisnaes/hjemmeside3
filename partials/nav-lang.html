
      <span class="fn-ls ls" aria-label="Sprog"><button type="button" onclick="setLang('da')" class="on" aria-label="DA – skift til dansk">DA</button><span aria-hidden="true">/</span><button type="button" onclick="setLang('en')" aria-label="EN – switch to English">EN</button></span>
      <script>/* Sprogvalget EN følger med til næste side (sider uden engelsk ignorerer det) */document.addEventListener('click',function(e){var a=e.target.closest('a[href]');if(!a||document.documentElement.lang!=='en')return;var u=new URL(a.getAttribute('href'),location.href);if(u.origin!==location.origin||u.pathname===location.pathname||u.searchParams.has('lang'))return;u.searchParams.set('lang','en');a.href=u.href;});</script>
